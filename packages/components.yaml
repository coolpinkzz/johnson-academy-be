components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
      example:
        id: 5ebac534954b54139806c112
        email: fake@example.com
        name: fake name
        role: user

    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
        expires: 2020-05-12T16:18:04.793Z

    AuthTokens:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/Token'
        refresh:
          $ref: '#/components/schemas/Token'

    UserWithTokens:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/AuthTokens'

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

    Course:
      type: object
      properties:
        id:
          type: string
          format: objectId
        name:
          type: string
        description:
          type: string
        syllabus:
          type: array
          items:
            type: string
            format: objectId
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 507f1f77bcf86cd799439011
        name: Introduction to Programming
        description: Learn the basics of programming with hands-on exercises
        syllabus: ['507f1f77bcf86cd799439012', '507f1f77bcf86cd799439013']
        createdAt: 2023-01-01T00:00:00.000Z
        updatedAt: 2023-01-01T00:00:00.000Z

    Module:
      type: object
      properties:
        id:
          type: string
          format: objectId
        syllabusId:
          type: string
          format: objectId
        type:
          type: string
          enum: [theory, technical, learning]
        title:
          type: string
        description:
          type: string
        session:
          type: integer
          minimum: 1
        resources:
          type: array
          items:
            type: object
            properties:
              file:
                type: string
              key:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 507f1f77bcf86cd799439021
        syllabusId: 507f1f77bcf86cd799439011
        type: theory
        title: Introduction to Programming Concepts
        description: Learn the fundamental concepts of programming
        session: 1
        resources:
          - file: https://example.com/video.mp4
            key: intro_video
          - file: https://example.com/slides.pdf
            key: intro_slides
        createdAt: 2023-01-01T00:00:00.000Z
        updatedAt: 2023-01-01T00:00:00.000Z

    Class:
      type: object
      properties:
        id:
          type: string
          format: objectId
        name:
          type: string
          description: Class name
        teachers:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                format: objectId
              name:
                type: string
              email:
                type: string
                format: email
              role:
                type: string
                enum: [teacher]
          description: Teachers assigned to the class (populated)
        courseId:
          type: object
          properties:
            _id:
              type: string
              format: objectId
            title:
              type: string
            description:
              type: string
          description: Course information (populated)
        students:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                format: objectId
              name:
                type: string
              email:
                type: string
                format: email
              role:
                type: string
                enum: [student]
          description: Array of enrolled students (populated)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 507f1f77bcf86cd799439031
        name: 'Advanced Mathematics 101'
        teachers:
          - _id: 507f1f77bcf86cd799439011
            name: 'Dr. Smith'
            email: 'smith@academy.com'
            role: 'teacher'
          - _id: 507f1f77bcf86cd799439099
            name: 'Dr. Jones'
            email: 'jones@academy.com'
            role: 'teacher'
        courseId:
          _id: 507f1f77bcf86cd799439012
          title: 'Advanced Mathematics'
          description: 'Advanced mathematical concepts and techniques'
        students:
          - _id: 507f1f77bcf86cd799439013
            name: 'John Doe'
            email: 'john@student.com'
            role: 'student'
          - _id: 507f1f77bcf86cd799439014
            name: 'Jane Smith'
            email: 'jane@student.com'
            role: 'student'
        createdAt: 2023-01-01T00:00:00.000Z
        updatedAt: 2023-01-01T00:00:00.000Z

    Syllabus:
      type: object
      properties:
        id:
          type: string
          format: objectId
        courseId:
          type: string
          format: objectId
          description: Course ID that this syllabus belongs to
        title:
          type: string
          description: Syllabus title
        description:
          type: string
          description: Syllabus description
        theory:
          type: array
          items:
            type: string
            format: objectId
          description: Array of theory module IDs
        technical:
          type: array
          items:
            type: string
            format: objectId
          description: Array of technical module IDs
        learning:
          type: array
          items:
            type: string
            format: objectId
          description: Array of learning module IDs
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 507f1f77bcf86cd799439041
        courseId: 507f1f77bcf86cd799439011
        title: 'Introduction to Programming Syllabus'
        description: 'Complete syllabus for programming fundamentals'
        theory: ['507f1f77bcf86cd799439021', '507f1f77bcf86cd799439022']
        technical: ['507f1f77bcf86cd799439023']
        learning: ['507f1f77bcf86cd799439024']
        createdAt: 2023-01-01T00:00:00.000Z
        updatedAt: 2023-01-01T00:00:00.000Z

    ModuleProgress:
      type: object
      properties:
        moduleId:
          type: string
          format: objectId
          description: Module ID
        status:
          type: string
          enum: [completed, inprogress, upcoming]
          description: Module progress status
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Module score (0-100)
        startDate:
          type: string
          format: date-time
          description: Module start date
        endDate:
          type: string
          format: date-time
          description: Module completion date
        dateTakenToComplete:
          type: number
          minimum: 0
          description: Number of days taken to complete the module
      example:
        moduleId: 507f1f77bcf86cd799439021
        status: completed
        score: 95
        startDate: 2023-01-01T00:00:00.000Z
        endDate: 2023-01-05T00:00:00.000Z
        dateTakenToComplete: 4

    SyllabusProgress:
      type: object
      properties:
        syllabusId:
          type: string
          format: objectId
          description: Syllabus ID
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleProgress'
          description: Array of module progress for this syllabus
      example:
        syllabusId: 507f1f77bcf86cd799439041
        modules:
          - moduleId: 507f1f77bcf86cd799439021
            status: completed
            score: 95
            startDate: 2023-01-01T00:00:00.000Z
            endDate: 2023-01-05T00:00:00.000Z

    StudentProgress:
      type: object
      properties:
        id:
          type: string
          format: objectId
        studentId:
          type: string
          format: objectId
          description: Student ID
        classId:
          type: string
          format: objectId
          description: Class ID
        courseId:
          type: string
          format: objectId
          description: Course ID
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress percentage (0-100)
        syllabusProgress:
          type: array
          items:
            $ref: '#/components/schemas/SyllabusProgress'
          description: Array of syllabus progress
        totalModules:
          type: number
          minimum: 0
          description: Total number of modules
        completedModules:
          type: number
          minimum: 0
          description: Number of completed modules
        inProgressModules:
          type: number
          minimum: 0
          description: Number of modules in progress
        upcomingModules:
          type: number
          minimum: 0
          description: Number of upcoming modules
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 507f1f77bcf86cd799439051
        studentId: 507f1f77bcf86cd799439013
        classId: 507f1f77bcf86cd799439031
        courseId: 507f1f77bcf86cd799439012
        progress: 75
        syllabusProgress:
          - syllabusId: 507f1f77bcf86cd799439041
            modules:
              - moduleId: 507f1f77bcf86cd799439021
                status: completed
                score: 95
        totalModules: 10
        completedModules: 7
        inProgressModules: 2
        upcomingModules: 1
        createdAt: 2023-01-01T00:00:00.000Z
        updatedAt: 2023-01-01T00:00:00.000Z

    UpdateModuleProgress:
      type: object
      properties:
        moduleId:
          type: string
          format: objectId
          required: true
          description: Module ID to update
        syllabusId:
          type: string
          format: objectId
          required: true
          description: Syllabus ID
        status:
          type: string
          enum: [completed, inprogress, upcoming]
          required: true
          description: New module status
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Module score (0-100)
      example:
        moduleId: 507f1f77bcf86cd799439021
        syllabusId: 507f1f77bcf86cd799439041
        status: completed
        score: 95

    StartModule:
      type: object
      properties:
        moduleId:
          type: string
          format: objectId
          required: true
          description: Module ID to start
        syllabusId:
          type: string
          format: objectId
          required: true
          description: Syllabus ID
      example:
        moduleId: 507f1f77bcf86cd799439021
        syllabusId: 507f1f77bcf86cd799439041

    EndModule:
      type: object
      properties:
        moduleId:
          type: string
          format: objectId
          required: true
          description: Module ID to end
        syllabusId:
          type: string
          format: objectId
          required: true
          description: Syllabus ID
        score:
          type: number
          minimum: 0
          maximum: 100
          required: true
          description: Final module score (0-100)
      example:
        moduleId: 507f1f77bcf86cd799439021
        syllabusId: 507f1f77bcf86cd799439041
        score: 95

    ProgressStatistics:
      type: object
      properties:
        totalStudents:
          type: number
          description: Total number of students
        averageProgress:
          type: number
          description: Average progress percentage
        completedModules:
          type: number
          description: Total completed modules
        inProgressModules:
          type: number
          description: Total modules in progress
        upcomingModules:
          type: number
          description: Total upcoming modules
      example:
        totalStudents: 25
        averageProgress: 78.5
        completedModules: 175
        inProgressModules: 50
        upcomingModules: 25

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Bad request
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
